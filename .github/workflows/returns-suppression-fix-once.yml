name: One-time clean returns suppression fix

on:
  push:
    branches:
      - fix/returns-rufus-suppression
    paths:
      - .github/workflows/returns-suppression-fix-once.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/returns-rufus-suppression
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch returns behavior
        run: python scripts/returns_fix_once.py
      - name: Install browser dependency
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y chromium
      - name: Validate and regression test
        run: |
          python scripts/validate.py
          python scripts/browser_smoke.py
          python scripts/adversarial_smoke.py
          python scripts/package.py
      - name: Commit tested fix and self-delete
        run: |
          rm .github/workflows/returns-suppression-fix-once.yml
          rm scripts/returns_fix_once.py
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add -A
          git commit -m "Fix Rufus suppression on Amazon returns"
          git push origin HEAD:fix/returns-rufus-suppression
