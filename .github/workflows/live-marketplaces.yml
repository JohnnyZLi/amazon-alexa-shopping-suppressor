name: Live Amazon marketplace smoke

on:
  push:
    branches:
      - test/live-all-marketplaces

permissions:
  contents: read

jobs:
  live-marketplaces:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser-test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Ensure Xvfb is available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Exercise all 23 live Amazon marketplaces
        id: smoke
        continue-on-error: true
        run: xvfb-run -a python scripts/live_marketplace_smoke.py
      - name: Upload live marketplace report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-marketplace-report-${{ github.sha }}
          path: artifacts/live-marketplaces/
          if-no-files-found: warn
      - name: Fail on extension regressions
        if: steps.smoke.outcome == 'failure'
        run: exit 1
