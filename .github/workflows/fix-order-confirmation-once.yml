name: One-time order confirmation fix

on:
  push:
    branches:
      - release/1.0.0-prep
    paths:
      - '.github/workflows/fix-order-confirmation-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.0-prep
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply route-policy patch
        run: python scripts/patch_order_confirmation_once.py
      - name: Commit fix and remove one-time helpers
        shell: bash
        run: |
          rm scripts/patch_order_confirmation_once.py
          rm .github/workflows/fix-order-confirmation-once.yml
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add -A
          git commit -m "Fix Rufus suppression on order confirmation"
          git push origin HEAD:release/1.0.0-prep
