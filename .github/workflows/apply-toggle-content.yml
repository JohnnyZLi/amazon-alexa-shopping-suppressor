name: Apply toggle runtime integration

on:
  push:
    branches:
      - feature/on-off-toggle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply toggle runtime integration
        run: |
          set -euo pipefail
          python scripts/apply_toggle_patch.py
          node --check content.js
          rm scripts/apply_toggle_patch.py
          rm .github/workflows/apply-toggle-content.yml

          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add content.js scripts/apply_toggle_patch.py .github/workflows/apply-toggle-content.yml
          git commit -m "Integrate persistent on/off state"
          git push origin HEAD:feature/on-off-toggle
