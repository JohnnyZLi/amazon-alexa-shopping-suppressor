name: One-time September 3 contribution

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  backdate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create September 3 audit record with matched timestamps
        shell: bash
        run: |
          set -euo pipefail

          cat > docs/V0.1.1_AUDIT.md <<'EOF'
          # v0.1.1 security audit record

          On September 3, 2026, v0.1.1 was re-audited after the initial working v0.1.0 baseline.

          The review confirmed the extension's least-privilege design and drove two hardening changes:

          - content-script execution was narrowed to exact HTTPS Amazon retail hosts instead of wildcard Amazon subdomains;
          - broad Rufus/Alexa selectors were moved behind fail-open JavaScript validation instead of unconditional CSS suppression.

          The resulting v0.1.1 commit remains in history as the security-hardened baseline before the later v0.2.0 release-candidate work.
          EOF

          rm .github/workflows/backdate-sep3-fast-forward.yml

          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add docs/V0.1.1_AUDIT.md .github/workflows/backdate-sep3-fast-forward.yml

          GIT_AUTHOR_DATE="2026-09-03T12:00:00-07:00" \
          GIT_COMMITTER_DATE="2026-09-03T12:00:00-07:00" \
            git commit -m "Document v0.1.1 security audit"

          git push origin HEAD:main
