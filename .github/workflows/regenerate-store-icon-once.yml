name: One-time store icon regeneration

on:
  push:
    branches:
      - release/1.0.0-prep
    paths:
      - '.github/workflows/regenerate-store-icon-once.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.0-prep
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic icons
        run: python scripts/generate_icons.py
      - name: Validate generated assets
        run: python scripts/validate.py
      - name: Commit generated icon and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-store-icon-once.yml
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add icons .github/workflows/regenerate-store-icon-once.yml
          git commit -m "Regenerate store icon with compliant padding"
          git push origin HEAD:release/1.0.0-prep
