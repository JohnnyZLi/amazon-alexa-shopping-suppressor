name: Apply reversible toggle dock state

on:
  push:
    branches:
      - feature/on-off-toggle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reversible dock-state patch
        run: |
          set -euo pipefail
          python scripts/apply_toggle_restore_patch.py
          node --check content.js
          rm scripts/apply_toggle_restore_patch.py
          rm .github/workflows/apply-toggle-restore.yml

          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add content.js scripts/apply_toggle_restore_patch.py .github/workflows/apply-toggle-restore.yml
          git commit -m "Restore dock state when suppressor is turned off"
          git push origin HEAD:feature/on-off-toggle
