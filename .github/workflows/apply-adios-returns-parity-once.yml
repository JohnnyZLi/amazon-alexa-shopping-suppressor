name: One-time Adios Returns parity fix

on:
  push:
    branches:
      - fix/returns-adios-parity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Preserve patch helper and reset to main
        shell: bash
        run: |
          cp scripts/_apply_adios_returns_parity.py /tmp/apply_adios_returns_parity.py
          git fetch origin main
          git checkout -B work origin/main
          git revert --no-commit ee848a36d6d9014525d58622fb6104238b20b8b0

      - name: Install browser-test dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Apply Adios-aligned Returns fix
        run: python /tmp/apply_adios_returns_parity.py

      - name: Review diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- content.js scripts/browser_smoke.py

      - name: Run source and manifest checks
        run: python scripts/validate.py

      - name: Run synthetic Chromium regression checks
        run: python scripts/browser_smoke.py

      - name: Run adversarial Chromium regression checks
        run: python scripts/adversarial_regression.py

      - name: Build deterministic extension package
        run: python scripts/package.py

      - name: Commit validated fix to main
        shell: bash
        run: |
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add content.js scripts/browser_smoke.py
          git commit -m "Preserve Amazon Returns while suppressing Alexa"
          git push origin HEAD:main
