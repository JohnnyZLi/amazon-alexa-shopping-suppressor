name: Fresh install default On

on:
  push:
    branches:
      - test/1.0.0-deep-us-acceptance
    paths:
      - '.github/workflows/fresh-install-default.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependency
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y chromium xvfb unzip
      - name: Build and extract exact candidate
        run: |
          python scripts/package.py
          mkdir -p /tmp/aas-exact-package
          unzip -q dist/amazon-alexa-shopping-suppressor-v1.0.0.zip -d /tmp/aas-exact-package
          cat dist/amazon-alexa-shopping-suppressor-v1.0.0.zip.sha256
      - name: Verify exact packaged extension defaults On
        shell: bash
        env:
          AAS_EXTENSION_ROOT: /tmp/aas-exact-package
        run: |
          cat > /tmp/fresh_install.py <<'PY'
          import asyncio, json, os, shutil, tempfile
          from pathlib import Path
          from playwright.async_api import async_playwright

          ROOT = Path(os.environ['AAS_EXTENSION_ROOT']).resolve()

          def browser_path():
              for name in ('chromium', 'chromium-browser', 'google-chrome', 'google-chrome-stable'):
                  path = shutil.which(name)
                  if path:
                      return path
              raise RuntimeError('No Chrome/Chromium found')

          async def main():
              profile = Path(tempfile.mkdtemp(prefix='aas-fresh-install-'))
              try:
                  async with async_playwright() as pw:
                      context = await pw.chromium.launch_persistent_context(
                          str(profile), executable_path=browser_path(), headless=False,
                          args=[f'--disable-extensions-except={ROOT}', f'--load-extension={ROOT}', '--no-first-run', '--disable-dev-shm-usage'],
                      )
                      try:
                          page = await context.new_page()
                          await page.goto('chrome://extensions/', wait_until='domcontentloaded', timeout=15000)
                          extension_id = None
                          for _ in range(40):
                              items = await page.evaluate('''() => {
                                const manager = document.querySelector('extensions-manager');
                                const list = manager?.shadowRoot?.querySelector('extensions-item-list');
                                const nodes = list?.shadowRoot?.querySelectorAll('extensions-item') || [];
                                return [...nodes].map(item => ({
                                  id: item.id || item.getAttribute('id') || '',
                                  name: item.shadowRoot?.querySelector('#name')?.textContent?.trim() || '',
                                }));
                              }''')
                              for item in items:
                                  if 'Suppressor' in item.get('name', ''):
                                      extension_id = item.get('id')
                                      break
                              if extension_id:
                                  break
                              await page.wait_for_timeout(250)
                          if not extension_id:
                              raise AssertionError('Could not discover loaded extension')

                          popup = await context.new_page()
                          await popup.goto(f'chrome-extension://{extension_id}/popup.html', wait_until='domcontentloaded', timeout=15000)
                          await popup.wait_for_selector('#enabled', timeout=10000)
                          checked = await popup.is_checked('#enabled')
                          status = (await popup.locator('#status').text_content() or '').strip()
                          stored = await popup.evaluate("() => chrome.storage.local.get({ enabled: true })")
                          version = await popup.evaluate('() => chrome.runtime.getManifest().version')
                          print(json.dumps({'checked': checked, 'status': status, 'stored': stored, 'version': version}, sort_keys=True))
                          assert version == '1.0.0', f'Unexpected packaged version {version!r}'
                          assert checked is True, 'Fresh install toggle was not On'
                          assert status == 'On', f'Fresh install status was {status!r}'
                          assert stored.get('enabled') is True, f'Fresh install storage/default resolved to {stored!r}'
                      finally:
                          await context.close()
              finally:
                  shutil.rmtree(profile, ignore_errors=True)

          asyncio.run(main())
          PY
          xvfb-run -a python /tmp/fresh_install.py
