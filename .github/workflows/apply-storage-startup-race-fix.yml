name: Apply storage startup race fix

on:
  push:
    branches:
      - fix/storage-startup-race

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply startup preference race fix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/patch_race.py
          python /tmp/patch_race.py
          node --check content.js
          node --check popup.js
          python -m py_compile scripts/browser_smoke.py scripts/validate.py scripts/package.py
          rm .github/workflows/apply-storage-startup-race-fix.yml
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add content.js manifest.json scripts/browser_smoke.py scripts/validate.py CHANGELOG.md README.md docs/TEST_PLAN.md docs/STORE_SUBMISSION.md .github/workflows/apply-storage-startup-race-fix.yml
          git commit -m "Fix saved-Off startup race"
          git push origin HEAD:fix/storage-startup-race
