name: "Apply latest dock snapshot fix"

on:
  push:
    branches:
      - fix/latest-dock-snapshot

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Apply patch
        run: python scripts/apply_latest_dock_snapshot_fix.py
      - name: Validate patched candidate
        run: |
          node --check content.js
          node --check popup.js
          python scripts/validate.py
          python scripts/browser_smoke.py
          python scripts/package.py
      - name: Commit patched candidate
        run: |
          rm .github/workflows/apply-latest-dock-snapshot-fix.yml
          rm scripts/apply_latest_dock_snapshot_fix.py
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add -A
          git commit -m "Replace stale dock restoration snapshots"
          git push origin HEAD:fix/latest-dock-snapshot
