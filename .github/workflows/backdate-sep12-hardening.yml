name: One-time September 12 lifecycle hardening

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lifecycle and dock-state hardening
        run: python .github/scripts/sep12_harden.py

      - name: Remove one-time helpers
        run: |
          rm .github/workflows/backdate-sep12-hardening.yml
          rm .github/scripts/sep12_harden.py

      - name: Validate hardening
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate.py
          python scripts/browser_smoke.py
          python scripts/adversarial_smoke.py
          python scripts/package.py

      - name: Commit September 12 hardening
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add -A
          GIT_AUTHOR_DATE="2026-09-12T12:00:00-07:00" \
          GIT_COMMITTER_DATE="2026-09-12T12:00:00-07:00" \
            git commit -m "Harden Amazon lifecycle and dock-state handling"
          git push origin HEAD:main
