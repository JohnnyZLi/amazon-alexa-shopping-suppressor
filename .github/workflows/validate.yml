name: Validate extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run source and manifest checks
        run: python scripts/validate.py
      - name: Run synthetic Chromium regression checks
        run: python scripts/browser_smoke.py
      - name: Build deterministic extension package
        run: python scripts/package.py
      - name: Show package checksum
        run: cat dist/*.sha256
      - name: Upload exact candidate package
        uses: actions/upload-artifact@v4
        with:
          name: extension-candidate-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
