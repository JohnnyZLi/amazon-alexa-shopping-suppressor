name: Validate extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install browser-test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run source and manifest checks
        run: python scripts/validate.py
      - name: Run synthetic Chromium regression checks
        run: python scripts/browser_smoke.py
      - name: Run adversarial Chromium regression checks
        run: python scripts/adversarial_smoke.py
      - name: Build deterministic extension package
        run: python scripts/package.py
      - name: Show package checksum
        run: cat dist/*.sha256
      - name: Upload exact candidate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-candidate-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error