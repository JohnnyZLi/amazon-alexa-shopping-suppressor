name: Amazon US 1.0.0 acceptance

on:
  push:
    branches:
      - test/1.0.0-deep-us-acceptance
    paths:
      - '.github/workflows/us-1.0.0-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependency
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y chromium xvfb
      - name: Load deep acceptance harness
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/JohnnyZLi/amazon-alexa-shopping-suppressor/test/us-release-acceptance/scripts/us_release_acceptance.py \
            -o scripts/us_release_acceptance.py
      - name: Run deep live Amazon US acceptance
        env:
          AAS_LONG_MINUTES: '30'
        run: xvfb-run -a python scripts/us_release_acceptance.py
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-1.0.0-acceptance-${{ github.sha }}
          path: artifacts/us-release-acceptance/
          if-no-files-found: error
