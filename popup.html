<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alexa Shopping Suppressor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-enabled="true">
  <main class="popup">
    <header class="brand">
      <img class="brand-icon" src="icons/icon-48.png" alt="" width="36" height="36">
      <div class="brand-copy">
        <h1>Alexa Shopping Suppressor</h1>
        <p>Rufus control for Amazon</p>
      </div>
    </header>

    <section class="control-card" aria-labelledby="control-title">
      <div class="control-row">
        <div class="control-heading">
          <strong id="control-title">Suppressor</strong>
          <span id="status" class="status-badge" aria-live="polite">On</span>
        </div>

        <label class="switch" for="enabled" aria-label="Turn Alexa Shopping Suppressor on or off">
          <input id="enabled" type="checkbox" role="switch" aria-describedby="state-description" checked>
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>

      <p id="state-description" class="state-description">Rufus hidden · sidebar space reclaimed</p>
    </section>

    <footer class="footer">
      <span class="privacy-dot" aria-hidden="true"></span>
      <span>Setting stored locally · no tracking</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
